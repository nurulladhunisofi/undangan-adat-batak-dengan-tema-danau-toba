<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="starGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4EBDD"/>
      <stop offset="60%" stop-color="#B99A5A"/>
      <stop offset="100%" stop-color="#8C5141"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#starGold)" stroke-width="1.5">
    <!-- 8-point Islamic Star -->
    <rect x="25" y="25" width="50" height="50" transform="rotate(0 50 50)"/>
    <rect x="25" y="25" width="50" height="50" transform="rotate(45 50 50)"/>
    <circle cx="50" cy="50" r="18" stroke-width="1"/>
    <circle cx="50" cy="50" r="32" stroke-width="0.8" stroke-dasharray="2 3"/>
    <circle cx="50" cy="50" r="4" fill="#B99A5A"/>
  </g>
</svg>